<div id="kb-host" style="position:fixed;inset:0;z-index:999999"></div>
<script type="module">
const TPL = String.raw`<style>
/* ===== TOKEN TEMA ===== */
:host, :host([data-theme="dark"]){
  color-scheme:dark;
  --bg:#0B0B0D; --surface:#18181C; --surface2:#222228;
  --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.11); --glass-line:rgba(255,255,255,.13);
  --input:rgba(255,255,255,.08); --border:rgba(255,255,255,.13);
  --text:#FFFFFF; --muted:#FFFFFF;
  --accent:#FF8A1F; --accent-2:#FF6A00; --accent-soft:rgba(255,138,31,.16);
  --danger:#FF5C5C; --overlay:rgba(0,0,0,.6);
  --shadow:0 18px 44px rgba(0,0,0,.45);
  --blur:blur(20px) saturate(140%);
  --glow:radial-gradient(60% 40% at 92% 0%,rgba(255,138,31,.30),transparent 70%),radial-gradient(50% 35% at 0% 100%,rgba(255,90,0,.24),transparent 70%);
}
:host([data-theme="light"]){
  color-scheme:light;
  --bg:#F3F0EB; --surface:#FFFFFF; --surface2:#FBFAF8;
  --glass:rgba(255,255,255,.72); --glass-2:rgba(255,255,255,.88); --glass-line:rgba(0,0,0,.08);
  --input:rgba(255,255,255,.92); --border:rgba(0,0,0,.1);
  --text:#000000; --muted:#000000;
  --accent:#F57C00; --accent-2:#EA6A00; --accent-soft:rgba(245,124,0,.13);
  --danger:#DC2626; --overlay:rgba(30,20,10,.35);
  --shadow:0 16px 40px rgba(80,50,20,.12);
  --blur:blur(18px) saturate(130%);
  --glow:radial-gradient(60% 40% at 92% 0%,rgba(255,170,80,.35),transparent 70%),radial-gradient(50% 35% at 0% 100%,rgba(255,200,130,.28),transparent 70%);
}

/* Semua teks aplikasi memakai warna tema (specificity 0, sehingga kelas khusus tetap menang) */
:where(#app,#app *,#modal,#modal *,#sheet,#sheet *,#toast,#splash,#splash *){color:var(--text)}
:where(select option){background:var(--surface);color:var(--text)}
::placeholder{color:var(--text);opacity:.55}

*{box-sizing:border-box;margin:0;padding:0}
:host{display:block;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;color:var(--text)}
button,input,select{font:inherit}
#app{position:fixed;inset:0;z-index:999999;overflow:hidden;background:var(--glow),var(--bg)}
.hidden{display:none!important}
small{display:block;font-size:11px;font-weight:600;line-height:1.35}
.muted{color:var(--muted)}

/* ===== IKON ===== */
.ic{width:20px;height:20px;stroke-width:1.9;display:inline-block;vertical-align:middle;flex-shrink:0}
.ic-tile{width:44px;height:44px;border-radius:16px;display:inline-grid;place-items:center;background:linear-gradient(145deg,rgba(255,138,31,.28),rgba(255,138,31,.08));border:1px solid rgba(255,138,31,.25);color:var(--accent);flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.ic-tile .ic{width:20px;height:20px}
.ic-tile.lg{width:54px;height:54px;border-radius:19px}
.ic-tile.lg .ic{width:24px;height:24px}

/* ===== SPLASH ===== */
#splash{position:fixed;inset:0;z-index:9999998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--glow),var(--bg);transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
.splash-logo{width:108px;height:108px;border-radius:34px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));font-size:54px;font-weight:800;color:#fff;overflow:hidden;box-shadow:0 22px 50px rgba(255,120,20,.45);animation:breathe 1.8s ease-in-out infinite}
.splash-logo img{width:100%;height:100%;object-fit:cover}
#splash-name{font-size:17px;font-weight:800}
.dots{display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}

/* ===== LOGO & AVATAR ===== */
.logo{display:grid;place-items:center;width:50px;height:50px;border-radius:17px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:20px;font-weight:800;overflow:hidden;flex-shrink:0;box-shadow:0 10px 24px rgba(255,120,20,.35)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.logo.sm{width:38px;height:38px;font-size:16px;border-radius:13px;box-shadow:0 6px 16px rgba(255,120,20,.3)}
.logo.lg{width:96px;height:96px;border-radius:30px;font-size:40px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:800;font-size:14px;flex-shrink:0;box-shadow:0 6px 16px rgba(255,120,20,.35)}

/* ===== KARTU KACA ===== */
.glass,.card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-line);border-radius:26px;box-shadow:var(--shadow)}
.card{padding:16px;margin-bottom:14px}
.card h3{font-size:14px;font-weight:800;margin-bottom:10px}

/* ===== LOGIN ===== */
#login{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.login-wrap{width:100%;max-width:380px}
.login-card{padding:26px;display:flex;flex-direction:column;gap:16px;border-radius:30px}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.brand h1{font-size:18px;font-weight:800;letter-spacing:-.01em}
.brand.small{flex-direction:row;align-items:center;text-align:left;gap:12px}
.brand.small b{display:block;font-weight:800;font-size:14px}

/* ===== FORM ===== */
.stack{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld span{font-size:12px;font-weight:600}
input,select{background:var(--input);border:1px solid var(--glass-line);border-radius:16px;padding:10px 14px;outline:none;width:100%;font-size:14px;color:var(--text);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--accent);padding:0}
.search{display:flex;align-items:center;gap:10px;background:var(--input);border:1px solid var(--glass-line);border-radius:999px;padding:0 16px;margin-bottom:14px;transition:border-color .15s}
.search:focus-within{border-color:var(--accent)}
.search .ic{width:18px;height:18px;color:var(--accent)}
.search input{background:transparent;border:0;padding:11px 0;box-shadow:none}
.search input:focus{box-shadow:none;border:0}

/* ===== TOMBOL ===== */
.btn{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:0;border-radius:999px;padding:11px 20px;color:#fff;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 10px 22px rgba(255,120,20,.32);transition:transform .15s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-block{width:100%}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-ghost{background:var(--glass-2);border:1px solid var(--glass-line);color:var(--text);box-shadow:none}
.btn-ghost:hover{border-color:var(--accent);filter:none}
.ico{background:var(--glass-2);border:1px solid var(--glass-line);border-radius:12px;padding:7px 9px;cursor:pointer;color:var(--text);display:inline-flex;align-items:center}
.ico .ic{width:16px;height:16px}
.ico:hover{border-color:var(--accent)}

/* ===== SEGMEN ===== */
.seg{display:flex;gap:4px;background:var(--input);border:1px solid var(--glass-line);border-radius:999px;padding:4px;flex-wrap:wrap;margin-bottom:12px}
.seg button{flex:1;min-width:0;background:transparent;border:0;border-radius:999px;padding:9px 12px;cursor:pointer;color:var(--text);font-weight:700;font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button .ic{width:16px;height:16px}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 8px 18px rgba(255,120,20,.3)}
.theme-seg{display:inline-flex;gap:2px;background:var(--input);border:1px solid var(--glass-line);border-radius:999px;padding:3px}
.theme-seg button{background:transparent;border:0;border-radius:999px;padding:6px 10px;cursor:pointer;color:var(--text);font-size:12px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.theme-seg button .ic{width:15px;height:15px}
.theme-seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.theme-row{display:flex;justify-content:center}
.paper-seg{margin:0 0 4px}
.paper-note{font-size:11px;font-weight:600;margin-top:6px}

/* ===== PESAN ===== */
.err{font-size:12px;font-weight:600;background:rgba(255,92,92,.14);border:1px solid rgba(255,92,92,.45);padding:10px 14px;border-radius:16px}
.banner{background:var(--accent-soft);border:1px solid rgba(255,138,31,.4);border-radius:16px;padding:10px 14px;font-size:12px;font-weight:600;margin-bottom:14px}
.empty{text-align:center;font-weight:600;font-size:12px;padding:24px 10px;border:1px dashed var(--glass-line);border-radius:20px;background:var(--glass)}
.skel{height:120px;border-radius:24px;background:linear-gradient(90deg,var(--glass) 25%,var(--glass-2) 37%,var(--glass) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;margin-bottom:14px}

/* ===== LAYOUT DESKTOP ===== */
#shell{position:absolute;inset:0;display:flex}
aside{width:240px;flex-shrink:0;padding:22px 14px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-right:1px solid var(--glass-line);display:flex;flex-direction:column;gap:16px}
.side{display:flex;flex-direction:column;gap:6px;flex:1;overflow:auto}
.side button{background:transparent;border:0;color:var(--text);text-align:left;padding:9px 12px;border-radius:18px;cursor:pointer;display:flex;gap:12px;align-items:center;font-weight:600;font-size:13px;transition:background .15s}
.side button:hover{background:var(--glass-2)}
.side button.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 10px 22px rgba(255,120,20,.32)}
.side button .ic-tile{width:32px;height:32px;border-radius:11px}
.side button .ic-tile .ic{width:16px;height:16px}
.side button.on .ic-tile{background:rgba(255,255,255,.22);border-color:transparent;color:#fff}
.side-foot{display:flex;flex-direction:column;gap:10px}
#logout{width:100%}
main#view{flex:1;overflow:auto;padding:26px 30px;min-width:0}
.bottom{display:none}
.topbar{display:none}

/* ===== HALAMAN ===== */
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h2{font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.page-head h2 .ic{width:22px;height:22px;color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.greet{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.greet b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em;margin-top:3px}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle;animation:ping 1.8s infinite}

/* Aksi cepat (dashboard) */
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.qk{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--glass-line);border-radius:22px;padding:12px 4px;cursor:pointer;color:var(--text);font-weight:700;font-size:11px;text-align:center;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:border-color .2s,transform .2s}
.qk:hover{border-color:var(--accent);transform:translateY(-2px)}
.qk .ic-tile{width:44px;height:44px;border-radius:15px}

/* Promo */
.promo{position:relative;border-radius:28px;padding:20px;overflow:hidden;background:linear-gradient(135deg,#FF9A3C 0%,#FF6A00 100%);color:#fff;margin-bottom:16px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 20px 40px rgba(255,110,20,.35)}
.promo.has-img{background-size:cover;background-position:center}
.promo.has-img::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.6))}
.promo>*{position:relative}
#app .promo,#app .promo *{color:#fff}
.promo small{font-weight:600;opacity:.92}
.promo h3{font-size:26px;font-weight:800;margin:4px 0 6px;letter-spacing:-.02em}
.promo .shine{position:absolute;top:0;bottom:0;width:45%;left:-60%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.28),transparent);animation:shine 3.8s ease-in-out infinite;pointer-events:none}
.promo .badge{position:absolute;right:16px;top:16px;background:#fff;border-radius:16px;padding:6px 10px;font-weight:800;font-size:16px;text-align:center;line-height:1.1;box-shadow:0 8px 18px rgba(0,0,0,.2)}
#app .promo .badge,#app .promo .badge *{color:#000}
.promo .badge small{font-size:9px;font-weight:700}

/* Statistik */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.stat{padding:16px;background:var(--glass);border:1px solid var(--glass-line);border-radius:24px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:transform .25s,border-color .25s}
.stat:hover{transform:translateY(-3px);border-color:var(--accent)}
.stat .ic-tile{margin-bottom:12px}
.stat small{font-size:11px}
.stat b{display:block;font-size:19px;font-weight:800;margin-top:2px}

/* Grafik */
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:24px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px}
.bar-col small{font-size:10px}
.bar{width:100%;background:linear-gradient(180deg,var(--accent),rgba(255,138,31,.2));border-radius:12px 12px 6px 6px;min-height:4px;position:relative;transform-origin:bottom}
.bar i{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;font-weight:700;white-space:nowrap}

/* Daftar */
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--glass-line)}
.item:last-child{border-bottom:0}
.item b{display:block;font-size:13px;font-weight:700}
.price{font-weight:800;color:var(--accent);white-space:nowrap;font-size:13px}
.btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.list-item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-line);margin-bottom:10px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:transform .2s}
.list-item:hover{transform:translateX(3px)}
.list-item .grow{flex:1;min-width:0}
.list-item b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb{width:48px;height:48px;border-radius:16px;flex-shrink:0;background:linear-gradient(145deg,rgba(255,138,31,.28),rgba(255,138,31,.08));color:var(--accent);display:grid;place-items:center;overflow:hidden}
.thumb .ic{width:22px;height:22px}
.thumb img{width:100%;height:100%;object-fit:cover}
.row-btn{width:100%;background:transparent;border:0;cursor:pointer;text-align:left;color:var(--text);border-radius:22px;padding:0}
.row-btn:hover{background:var(--glass)}
.sum-line{font-weight:700;margin-bottom:10px;font-size:12px}
.filter{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.filter .fld{flex:1;min-width:150px;margin:0}
.media-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.file-btn{cursor:pointer}
.hero-prev{height:150px;border-radius:20px;overflow:hidden;border:1px dashed var(--glass-line);display:grid;place-items:center;background:var(--input);font-weight:600;text-align:center;padding:10px;font-size:12px}
.hero-prev img{width:100%;height:100%;object-fit:cover;display:block}

/* ===== POS ===== */
.pos{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid-cards>.empty{grid-column:1/-1}
.tile{position:relative;background:var(--glass-2);border:1px solid var(--glass-line);border-radius:26px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:var(--text);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:border-color .2s,transform .2s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile-art{width:100%;height:92px;border-radius:20px}
.tile-art .ic{width:34px;height:34px}
.tile b{font-size:13px;font-weight:700;line-height:1.25;margin-top:2px}
.tile small{font-size:11px;font-weight:600}
.tile-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:4px}
.price-s{font-weight:800;color:var(--accent);font-size:13px}
.add{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px rgba(255,120,20,.4)}
.add .ic{width:16px;height:16px;stroke-width:2.4}
.cart{position:sticky;top:0}
.cart-items{margin:8px 0 14px;max-height:260px;overflow:auto}
.qty{display:flex;align-items:center;gap:8px;font-weight:800}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass-2);cursor:pointer;color:var(--text);font-weight:800}
.sum{margin:10px 0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.sum>div{display:flex;justify-content:space-between}
.sum .grand{font-size:15px;border-top:1px solid var(--glass-line);padding-top:10px;margin-top:4px}
.sum .grand b{color:var(--accent);font-weight:800}
.kembali{margin:6px 0 12px;font-size:13px;font-weight:700}

/* ===== MODAL, SHEET, TOAST ===== */
.modal-bg{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9999999}
.modal{width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:20px;border-radius:28px;background:var(--surface);color:var(--text)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head h3{font-size:16px;font-weight:800}
.x{background:var(--glass-2);border:0;width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--text);display:grid;place-items:center}
.x .ic{width:16px;height:16px}
.sheet-bg{position:fixed;inset:0;background:var(--overlay);z-index:9999995;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--glass-line);border-radius:30px 30px 0 0;padding:12px 18px 22px;max-height:88vh;overflow:auto;animation:sheetUp .32s cubic-bezier(.2,.8,.2,1)}
.sheet-grip{width:44px;height:5px;border-radius:99px;background:var(--glass-line);margin:0 auto 12px}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.menu-tile{background:var(--glass);border:1px solid var(--glass-line);border-radius:24px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;color:var(--text);font-weight:700;font-size:11px;text-align:center;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.menu-tile:hover{border-color:var(--accent)}
.menu-tile .ic-tile{width:50px;height:50px;border-radius:50%}
.sheet-foot{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.sheet-foot .theme-seg{align-self:center}
.qa-list{display:flex;flex-direction:column;gap:10px}
.qa-item{display:flex;align-items:center;gap:14px;background:var(--glass);border:1px solid var(--glass-line);border-radius:22px;padding:12px;cursor:pointer;color:var(--text);text-align:left;width:100%}
.qa-item:hover{border-color:var(--accent)}
.qa-item .grow{flex:1;min-width:0}
.qa-item b{display:block;font-weight:800;font-size:13px}
.qa-item small{font-weight:600;margin-top:2px}
.chev{width:20px;height:20px;color:var(--accent);display:grid;place-items:center}
.chev .ic{width:18px;height:18px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:999px;z-index:99999999;font-weight:700;font-size:12px;background:var(--surface);border:1px solid var(--glass-line);box-shadow:var(--shadow);max-width:90vw;text-align:center}

const PAPER_KEY = 'kb_paper';
const getPaper = () => { try { return localStorage.getItem(PAPER_KEY) === '80' ? '80' : '58'; } catch (e) { return '58'; } };
function applyPaper(mm) {
  const m = mm || getPaper();
  try { localStorage.setItem(PAPER_KEY, m); } catch (e) { /* abaikan */ }
  let pg = document.getElementById('kb-paper-page');
  if (!pg) { pg = document.createElement('style'); pg.id = 'kb-paper-page'; document.head.appendChild(pg); }
  pg.textContent = `@page{size:${m}mm auto;margin:0}`;
  let st = ROOT.getElementById('paper-style');
  if (!st) { st = document.createElement('style'); st.id = 'paper-style'; ROOT.appendChild(st); }
  st.textContent = `#print-area{width:${m}mm;padding:2mm}#print-area .struk{width:${m}mm}`;
  $$('.paper-seg button').forEach(b => b.classList.toggle('on', b.dataset.paper === m));
  $$('.struk-preview').forEach(el => { el.style.maxWidth = (m === '80' ? '340px' : '260px'); });
}
const paperSegHTML = () => {
  const m = getPaper();
  return `<div class="seg paper-seg"><button type="button" data-paper="58" class="${m === '58' ? 'on' : ''}">58 mm</button><button type="button" data-paper="80" class="${m === '80' ? 'on' : ''}">80 mm</button></div>`;
};
ROOT.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-paper]');
  if (b) applyPaper(b.dataset.paper);
});

// Login RPC untuk mode preview (meniru fungsi kasir_login & kasir_save di Supabase)
function previewRpc(name, a) {
  if (name === 'kasir_login') {
    const k = mem.kasir.find(x => x.username === a.p_username && x.aktif && x.password_hash === 'preview:' + a.p_password);
    return k ? [{ id: k.id, username: k.username, nama: k.nama }] : [];
  }
  if (name === 'kasir_save') {
    if (a.p_id) {
      const k = mem.kasir.find(x => x.id === a.p_id);
      if (!k) throw new Error('Akun tidak ditemukan');
      Object.assign(k, { username: a.p_username, nama: a.p_nama, aktif: a.p_aktif });
      if (a.p_password) k.password_hash = 'preview:' + a.p_password;
      return k.id;
    }
    if (!a.p_password || a.p_password.length < 4) throw new Error('Password minimal 4 karakter');
    const id = uid();
    mem.kasir.push({ id, username: a.p_username, nama: a.p_nama, aktif: a.p_aktif, password_hash: 'preview:' + a.p_password, created_at: new Date().toISOString() });
    return id;
  }
  throw new Error('RPC tidak dikenal');
}

// ===== ADAPTER DATA: preview (memori) atau Supabase (produksi) =====
const api = {
  async list(t, o = {}) {
    if (useMem()) {
      let rows = structuredClone(mem[t]);
      if (o.eq) for (const [k, v] of Object.entries(o.eq)) rows = rows.filter(r => r[k] === v);
      if (o.gte) rows = rows.filter(r => r[o.gte[0]] >= o.gte[1]);
      if (o.lte) rows = rows.filter(r => r[o.lte[0]] <= o.lte[1]);
      if (o.order) {
        const [c, asc = true] = o.order;
        rows.sort((a, b) => ((a[c] > b[c]) ? 1 : (a[c] < b[c]) ? -1 : 0) * (asc ? 1 : -1));
      }
      return rows;
    }
    let q = sb.from(t).select('*');
    if (o.eq) for (const [k, v] of Object.entries(o.eq)) q = q.eq(k, v);
    if (o.gte) q = q.gte(o.gte[0], o.gte[1]);
    if (o.lte) q = q.lte(o.lte[0], o.lte[1]);
    if (o.order) q = q.order(o.order[0], { ascending: o.order[1] ?? true });
    const { data, error } = await q;
    if (error) throw error;
    return data;
  },
  async insert(t, row) {
    if (useMem()) {
      const r = { id: uid(), created_at: new Date().toISOString(), ...row };
      mem[t].push(r);
      return r;
    }
    const { data, error } = await sb.from(t).insert(row).select().single();
    if (error) throw error;
    return data;
  },
  async update(t, id, patch) {
    if (useMem()) {
      const r = mem[t].find(x => x.id === id);
      if (!r) throw new Error('Data tidak ditemukan');
      Object.assign(r, patch);
      return r;
    }
    const { data, error } = await sb.from(t).update(patch).eq('id', id).select().single();
    if (error) throw error;
    return data;
  },
  async remove(t, id) {
    if (useMem()) { mem[t] = mem[t].filter(x => x.id !== id); return; }
    const { error } = await sb.from(t).delete().eq('id', id);
    if (error) throw error;
  },
  async rpc(name, args) {
    if (useMem()) return previewRpc(name, args);
    const { data, error } = await sb.rpc(name, args);
    if (error) throw error;
    return data;
  }
};

async function doLogin(role, id, pw) {
  if (role === 'admin') {
    if (useMem()) return enter('admin', { id: 'admin', nama: 'Admin' });
    const { data, error } = await sb.auth.signInWithPassword({ email: id, password: pw });
    if (error) throw new Error('Email atau password admin salah');
    return enter('admin', { id: data.user.id, nama: 'Admin' });
  }
  const rows = await api.rpc('kasir_login', { p_username: id, p_password: pw });
  if (!rows?.length) throw new Error('Username atau password kasir salah');
  return enter('kasir', { id: rows[0].id, nama: rows[0].nama, username: rows[0].username });
}

  if (!useMem() && S.role === 'admin') await sb.auth.signOut();

// Animasi angka naik (menghormati pengaturan reduce-motion)
function animateCounts() {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  $$('[data-count]').forEach(el => {
    const to = Number(el.dataset.count) || 0;
    const fmt = v => el.dataset.kind === 'rp' ? rp(v) : Math.round(v).toLocaleString('id-ID');
    if (reduce || to === 0) { el.textContent = fmt(to); return; }
    const dur = 900, t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      el.textContent = fmt(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

function trxCard(t, n = 0) {

  const sub = cartTotal();
  const diskon = Math.min(Math.max(Number(S.diskon) || 0, 0), sub);

  const bayar = S.metode === 'Tunai' ? (Number(S.bayar) || 0) : total;
  const kembali = S.metode === 'Tunai' ? Math.max(0, bayar - total) : 0;
  return { sub, diskon, total, bayar, kembali };
};

  $$('[data-inc]').forEach(b => b.onclick = () => {
    const c = S.cart[+b.dataset.inc];
    if (c.tipe === 'produk' && c.qty >= c.stok) return toast('Stok tidak cukup', 'err');
    c.qty++;
    renderPOS();
  });

    const i = +b.dataset.dec;
    S.cart[i].qty--;

    renderPOS();
  });

// Kartu layanan/produk; dipisah agar pencarian tidak merender ulang seluruh halaman (fokus input tetap)
function paintGrid() {
  const isP = S.katalog === 'produk';
  const q = (S.q || '').trim().toLowerCase();
  const items = (isP ? S.pos.produk : S.pos.layanan).filter(i => !q || i.nama.toLowerCase().includes(q));
  $('#grid').innerHTML = items.map(i => `
    <button type="button" class="tile" data-id="${i.id}">
      <span class="ic-tile tile-art">${isP ? I.package : I.scissors}</span>
      <b>${esc(i.nama)}</b>
      <small>${isP ? `Stok ${i.stok}` : `${i.durasi_menit || 0} menit`}</small>
      <span class="tile-foot"><span class="price-s">${rp(i.harga)}</span><span class="add">${I.plus}</span></span>
    </button>`).join('') || empty(q ? 'Tidak ada yang cocok dengan pencarian' : 'Belum ada item aktif');
  $$('#grid .tile').forEach(b => b.onclick = () => addCart(b.dataset.id));
}

function addCart(id) {
  const isLay = S.katalog === 'layanan';
  const item = (isLay ? S.pos.layanan : S.pos.produk).find(x => x.id === id);
  if (!item) return;
  const ex = S.cart.find(c => c.refId === id);
  if (ex) {
    if (!isLay && ex.qty >= item.stok) return toast('Stok tidak cukup', 'err');
    ex.qty++;
  } else {
    if (!isLay && item.stok < 1) return toast('Stok habis', 'err');
    S.cart.push({ tipe: isLay ? 'layanan' : 'produk', refId: id, nama: item.nama, harga: Number(item.harga), qty: 1, stok: Number(item.stok) });
  }
  renderPOS();
}

async function checkout() {
  if (!S.cart.length) return toast('Keranjang kosong', 'err');
  const c = calc();
  if (S.metode === 'Tunai' && c.bayar < c.total) return toast('Uang diterima kurang', 'err');
  const kode = 'INV-' + ymd(new Date()).replace(/-/g, '') + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
  const btn = $('#bayar-btn');
  btn.disabled = true;
  try {
    const trx = await api.insert('transaksi', {
      kode_invoice: kode,
      kasir_id: S.role === 'kasir' ? S.user.id : null,
      kapster_id: S.kapsterId || null,
      subtotal: c.sub, diskon: c.diskon, total: c.total,
      metode_bayar: S.metode, bayar: c.bayar, kembalian: c.kembali
    });
    const items = [];
    for (const it of S.cart) {
      items.push(await api.insert('transaksi_item', {
        transaksi_id: trx.id,
        layanan_id: it.tipe === 'layanan' ? it.refId : null,
        produk_id: it.tipe === 'produk' ? it.refId : null,
        nama_snapshot: it.nama, harga: it.harga, qty: it.qty, subtotal: it.harga * it.qty
      }));
      if (it.tipe === 'produk') await api.update('produk', it.refId, { stok: it.stok - it.qty });
    }
    const kasirNama = S.role === 'kasir' ? S.user.nama : 'Admin';
    const kapNama = S.kapsterMap[S.kapsterId] || '';
    S.cart = []; S.diskon = ''; S.bayar = ''; S.kapsterId = '';
    toast('Transaksi berhasil');
    await openStruk(trx, items, kasirNama, kapNama);
    renderPOS();
  } catch (e) {
    err(e);
    btn.disabled = false;
  }
}

const groupBy = (rows, keyFn) => {
  const m = {};
  rows.forEach(r => {
    const k = keyFn(r) || '-';
    m[k] = m[k] || { n: 0, t: 0 };
    m[k].n++;
    m[k].t += Number(r.total) || 0;
  });
  return Object.entries(m).sort((a, b) => b[1].t - a[1].t);
};

const groupHTML = (title, groups) => `<div class="card glass"><h3>${title}</h3>
  ${groups.map(([k, v]) => `<div class="item"><div><b>${esc(k)}</b><small>${v.n} transaksi</small></div><div class="price">${rp(v.t)}</div></div>`).join('') || empty()}
</div>`;

function exportCSV() {
  const cols = ['kode', 'tanggal', 'kasir', 'kapster', 'metode', 'subtotal', 'diskon', 'total'];
  const lines = S.lRows.map(t => [
    t.kode_invoice, new Date(t.created_at).toISOString(), S.kasirMap[t.kasir_id] || 'Admin',
    S.kapsterMap[t.kapster_id] || '', t.metode_bayar, t.subtotal, t.diskon, t.total
  ].map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','));
  const blob = new Blob([[cols.join(','), ...lines].join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `laporan-${S.lFrom}-${S.lTo}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

  }
};

const formFields = (fields, data = {}) => fields.map(f => {
  if (f.t === 'bool') return `<label class="chk"><input type="checkbox" name="${f.k}" ${data[f.k] !== false ? 'checked' : ''}> ${f.l}</label>`;
  return `<label class="fld"><span>${f.l}</span><input name="${f.k}" type="${f.t === 'number' ? 'number' : 'text'}" value="${esc(data[f.k] ?? '')}" ${f.req ? 'required' : ''}></label>`;
}).join('');

const readForm = (form, fields) => {
  const o = {};
  fields.forEach(f => {
    const el = form.elements[f.k];
    o[f.k] = f.t === 'bool' ? el.checked : f.t === 'number' ? Number(el.value || 0) : el.value.trim();
  });
  return o;
};

async function pageCrud(key) {
  const c = CRUD[key];
  const rows = await api.list(key, { order: [c.order, true] });

function crudForm(key, row) {
  const c = CRUD[key];
  const data = row || c.def;
  openModal(`${row ? 'Ubah' : 'Tambah'} ${c.title}`, `<form id="f" class="stack">${formFields(c.fields, data)}<button class="btn btn-block" type="submit">Simpan</button></form>`, () => {
    $('#f').onsubmit = async e => {
      e.preventDefault();
      const vals = readForm(e.target, c.fields);
      try {
        if (row) await api.update(key, row.id, vals);
        else await api.insert(key, vals);
        closeModal();
        toast('Tersimpan');
        pageCrud(key);
      } catch (ex) { err(ex); }
    };
  });
}

async function crudDelete(key, id) {
  if (!window.confirm('Yakin ingin menghapus data ini?')) return;
  try {
    await api.remove(key, id);
    toast('Data dihapus');
    pageCrud(key);
  } catch (e) {
    toast('Tidak bisa dihapus. Nonaktifkan saja jika data sudah pernah dipakai transaksi.', 'err');
  }
}

// Gambar diubah ukurannya di browser lalu disimpan sebagai data URL (JPEG kecil).
function readImage(file, maxW) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) return reject(new Error('File harus berupa gambar'));
    if (file.size > 5 * 1024 * 1024) return reject(new Error('Ukuran gambar maksimal 5 MB'));
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxW / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => reject(new Error('Gagal membaca gambar'));
    img.src = URL.createObjectURL(file);
  });
}

        <div class="logo lg" id="logo-prev"></div>
        <div class="btns">
          <label class="btn btn-ghost btn-sm file-btn">Unggah logo<input type="file" accept="image/*" id="logo-file" hidden></label>
          <button class="btn btn-ghost btn-sm" type="button" id="logo-del">Hapus</button>
        </div>
      </div>
      <small>Logo tampil di layar pembuka, login, menu, dan struk. Disarankan gambar persegi.</small>
    </div>
    <div class="card glass">
      <h3>Foto Hero (gaya welcome)</h3>
      <div class="hero-prev" id="hero-prev"></div>
      <div class="btns" style="margin-top:12px">
        <label class="btn btn-ghost btn-sm file-btn">Unggah foto orang / barbershop<input type="file" accept="image/*" id="hero-file" hidden></label>
        <button class="btn btn-ghost btn-sm" type="button" id="hero-del">Hapus foto</button>
      </div>
      <small>Foto tampil sebagai latar kartu promo di dashboard. Gunakan foto yang Anda miliki atau yang sudah berizin.</small>
    </div>
    <div class="card glass">
      <h3>Profil Barbershop</h3>
      <form id="toko-form" class="stack">
        <label class="fld"><span>Nama barbershop</span><input name="nama" required value="${esc(t.nama || '')}"></label>
        <label class="fld"><span>Alamat</span><input name="alamat" value="${esc(t.alamat || '')}"></label>
        <label class="fld"><span>Telepon</span><input name="telepon" value="${esc(t.telepon || '')}"></label>
        <button class="btn btn-block" type="submit">Simpan Profil</button>
      </form>
    </div>
    <div class="card glass">
      <h3>Ganti Password Admin</h3>
      <form id="pw-form" class="stack">
        <label class="fld"><span>Password baru (min. 6 karakter)</span><input name="pw" type="password" required minlength="6" autocomplete="new-password"></label>
        <button class="btn btn-block" type="submit">Perbarui Password</button>
      </form>
    </div>`;
  preview();
  applyPaper();

  $('#logo-file').onchange = async e => {
    try { S.draftToko.logo_url = await readImage(e.target.files[0], 384); preview(); }
    catch (ex) { err(ex); }
  };
  $('#hero-file').onchange = async e => {
    try { S.draftToko.hero_url = await readImage(e.target.files[0], 1024); preview(); }
    catch (ex) { err(ex); }
  };
  $('#logo-del').onclick = () => { S.draftToko.logo_url = ''; preview(); };
  $('#hero-del').onclick = () => { S.draftToko.hero_url = ''; preview(); };

  $('#toko-form').onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    try {
      const saved = await api.update('pengaturan_toko', 1, {
        nama: f.nama.value.trim(), alamat: f.alamat.value.trim(), telepon: f.telepon.value.trim(),
        logo_url: S.draftToko.logo_url || null, hero_url: S.draftToko.hero_url || null
      });
      applyBrand(saved);
      toast('Profil tersimpan');
      pagePengaturan();
    } catch (ex) { err(ex); }
  };

  $('#pw-form').onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    try {
      if (useMem()) {
        toast('Mode preview: password tidak benar-benar diubah');
      } else {
        const { error } = await sb.auth.updateUser({ password: f.pw.value });
        if (error) throw error;
        toast('Password diperbarui');
      }
      f.reset();
    } catch (ex) { err(ex); }
  };
}

const PAGES = {
  dashboard: pageDashboard,
  pos: pagePOS,
  riwayat: pageRiwayat,
  layanan: () => pageCrud('layanan'),
  produk: () => pageCrud('produk'),
  kapster: () => pageCrud('kapster'),
  akun: pageAkun,
  laporan: pageLaporan,
  pengaturan: pagePengaturan
};

// ===== TEMA SIANG / MALAM =====
function applyTheme(t) {
  HOST.dataset.theme = t;
  try { localStorage.setItem('kb_theme', t); } catch (e) { /* abaikan */ }
  $$('.theme-switch button').forEach(b => b.classList.toggle('on', b.dataset.set === t));
}
$$('.theme-switch button').forEach(b => b.onclick = () => applyTheme(b.dataset.set));
applyTheme(HOST.dataset.theme || 'dark');

// ===== LOGIN =====
let loginRole = 'admin';
function setRoleSeg(r) {
  loginRole = r;
  $$('#role-seg button').forEach(b => b.classList.toggle('on', b.dataset.role === r));
  $('#id-label').textContent = r === 'admin' ? 'Email' : 'Username';
  $('#login-form [name=id]').type = r === 'admin' ? 'email' : 'text';
}
$$('#role-seg button').forEach(b => b.onclick = () => setRoleSeg(b.dataset.role));

$('#login-form').onsubmit = async e => {
  e.preventDefault();
  const f = e.target;
  $('#login-err').classList.add('hidden');
  try {
    await doLogin(loginRole, f.id.value.trim(), f.pw.value);
  } catch (ex) {
    $('#login-err').textContent = ex.message;
    $('#login-err').classList.remove('hidden');
  }
};

// ===== PWA (manifest data URI + service worker dari Blob) =====
function registerPWA() {
  if (!('serviceWorker' in navigator)) return;
  const src = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',()=>{});";
  try {
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([src], { type: 'text/javascript' }))).catch(() => {});
  } catch (e) { /* PWA opsional */ }
}

// ===== BOOT: splash → ambil brand → sesi / login =====
const wait = ms => new Promise(r => setTimeout(r, ms));

async function boot() {
  fillIcons();
  applyPaper();
  registerPWA();
  const started = Date.now();

  $('#demo-box').classList.toggle('hidden', !DEMO_ENABLED);
  $('#demo-admin').onclick = () => startDemo('admin').catch(err);
  $('#demo-kasir').onclick = () => startDemo('kasir').catch(err);

  // Ambil data brand (logo, nama, foto) — diizinkan untuk role anon
  let toko = {};
  try { toko = (await api.list('pengaturan_toko'))[0] || {}; } catch (e) { /* pakai default */ }
  applyBrand(toko);

  // Cek sesi yang masih berlaku
  let next = null;
  if (!IS_PREVIEW) {
    const { data } = await sb.auth.getSession();
    if (data.session) next = ['admin', { id: data.session.user.id, nama: 'Admin' }];
  }
  const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
  if (!next && saved?.demo && DEMO_ENABLED) next = [saved.role, saved.user, true];
  if (!next && (saved?.role === 'kasir' || (IS_PREVIEW && saved?.role === 'admin'))) next = [saved.role, saved.user];

  // Splash minimal 1,8 detik agar terasa seperti aplikasi
  await wait(Math.max(0, 1800 - (Date.now() - started)));
  $('#splash').classList.add('out');
  setTimeout(() => $('#splash').classList.add('hidden'), 500);

  if (next) return enter(next[0], next[1], !!next[2]);
  $('#login').classList.remove('hidden');
}
boot();

// Pengaman: jika aplikasi gagal dimuat, layar loading tidak macet selamanya
setTimeout(() => {
  const s = ROOT.getElementById('splash');
  if (s && !s.classList.contains('hidden') && !s.classList.contains('out')) {
    s.classList.add('out');
    $('#login').classList.remove('hidden');
    const e = $('#login-err');
    e.textContent = 'Aplikasi belum berhasil dimuat. Periksa koneksi internet lalu muat ulang halaman (tekan F5).';
    e.classList.remove('hidden');
  }
}, 8000);

</script>
